name: Web quality

on:
  pull_request:
    paths:
      - "01_WEB/**"
      - "03_COMPARTILHADO/**"
      - "04_BANCO_E_SUPABASE/supabase/migrations/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "07_CONFIGURACOES_DO_PROJETO/tsconfig.base.json"
      - "07_CONFIGURACOES_DO_PROJETO/*.mjs"
      - "06_TESTES_E_QUALIDADE/**"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "01_WEB/**"
      - "03_COMPARTILHADO/**"
      - "04_BANCO_E_SUPABASE/supabase/migrations/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "07_CONFIGURACOES_DO_PROJETO/tsconfig.base.json"
      - "07_CONFIGURACOES_DO_PROJETO/*.mjs"
      - "06_TESTES_E_QUALIDADE/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check database operations and publication guards
        run: node --test 06_TESTES_E_QUALIDADE/*.test.mjs
      - name: Lint
        run: pnpm lint:web
      - name: Typecheck
        run: pnpm typecheck:web
      - name: Tests
        run: pnpm test:web
      - name: Production build
        run: pnpm build:web
      - name: Cloudflare compatibility build
        run: pnpm --filter @metallo/web build:vinext

  deploy:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY NEXT_SERVER_ACTIONS_ENCRYPTION_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
      - name: Build for Cloudflare Workers
        run: pnpm --filter @metallo/web build:vinext
      - name: Synchronize Worker secrets
        shell: bash
        run: |
          node --input-type=module -e '
            process.stdout.write(JSON.stringify({
              NEXT_PUBLIC_SUPABASE_URL: process.env.NEXT_PUBLIC_SUPABASE_URL,
              NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: process.env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,
              NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: process.env.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY,
            }));
          ' | pnpm --filter @metallo/web exec wrangler secret bulk --config wrangler.jsonc
      - name: Deploy production Worker
        run: pnpm --filter @metallo/web exec wrangler deploy --config dist/server/wrangler.json
