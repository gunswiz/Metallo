name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'metallo_source.zip'
      - '.github/workflows/build_apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Extract app source
        run: |
          rm -rf app
          mkdir app
          unzip -q metallo_source.zip -d app

      - name: Generate Android project
        working-directory: app
        run: flutter create . --platforms=android --project-name metallo --org com.gunswiz

      - name: Configure Android permissions and auth deep link
        working-directory: app
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          marker = 'android:scheme="com.gunswiz.metallo"'
          if marker not in s:
              block = '''\n            <intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="com.gunswiz.metallo" android:host="auth-callback" />\n            </intent-filter>\n'''
              s = s.replace('        </activity>', block + '        </activity>', 1)
              p.write_text(s)
          PY
          grep -n 'android.permission.INTERNET\|com.gunswiz.metallo\|auth-callback' "$MANIFEST"

      - name: Configure permanent Android signing
        working-directory: app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/metallo-release.jks
          keytool -list -keystore android/app/metallo-release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

          python - <<'PY'
          from pathlib import Path
          kts = Path('android/app/build.gradle.kts')
          groovy = Path('android/app/build.gradle')

          if kts.exists():
              s = kts.read_text()
              if 'create("metalloRelease")' not in s:
                  marker = '    buildTypes {'
                  signing = '''    signingConfigs {\n        create("metalloRelease") {\n            keyAlias = System.getenv("ANDROID_KEY_ALIAS")\n            keyPassword = System.getenv("ANDROID_KEY_PASSWORD")\n            storeFile = file("metallo-release.jks")\n            storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")\n        }\n    }\n\n'''
                  if marker not in s:
                      raise SystemExit('Could not locate buildTypes in build.gradle.kts')
                  s = s.replace(marker, signing + marker, 1)
              s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("metalloRelease")')
              kts.write_text(s)
          elif groovy.exists():
              s = groovy.read_text()
              if 'metalloRelease {' not in s:
                  marker = '    buildTypes {'
                  signing = '''    signingConfigs {\n        metalloRelease {\n            keyAlias System.getenv("ANDROID_KEY_ALIAS")\n            keyPassword System.getenv("ANDROID_KEY_PASSWORD")\n            storeFile file("metallo-release.jks")\n            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")\n        }\n    }\n\n'''
                  if marker not in s:
                      raise SystemExit('Could not locate buildTypes in build.gradle')
                  s = s.replace(marker, signing + marker, 1)
              s = s.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.metalloRelease')
              s = s.replace('signingConfig = signingConfigs.debug', 'signingConfig = signingConfigs.metalloRelease')
              groovy.write_text(s)
          else:
              raise SystemExit('Android app Gradle file not found')
          PY

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate launcher icon
        working-directory: app
        run: dart run flutter_launcher_icons

      - name: Static analysis
        working-directory: app
        run: flutter analyze

      - name: Run tests
        working-directory: app
        run: flutter test

      - name: Build release APK
        working-directory: app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Verify APK signature
        working-directory: app
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK"
          keytool -printcert -jarfile "$APK" | grep -E 'Owner:|SHA256:'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: metallo-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
