name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '02_MOBILE/lib/**'
      - '02_MOBILE/assets/**'
      - '02_MOBILE/test/**'
      - '02_MOBILE/android/**'
      - '02_MOBILE/pubspec.yaml'
      - '02_MOBILE/pubspec.lock'
      - '02_MOBILE/analysis_options.yaml'
      - 'updates/**'
      - '07_CONFIGURACOES_DO_PROJETO/*.mjs'
      - '06_TESTES_E_QUALIDADE/*.test.mjs'
      - '04_BANCO_E_SUPABASE/supabase/**'
      - '.github/workflows/build_apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: 02_MOBILE

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Flutter stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Validate release versions and publication guards
        working-directory: .
        run: |
          node 07_CONFIGURACOES_DO_PROJETO/validar-versao.mjs
          node --test 06_TESTES_E_QUALIDADE/*.test.mjs

      - name: Configure permanent Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/metallo-release.jks
          keytool -list -keystore android/app/metallo-release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Verify APK signature
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"
          EXPECTED="5B95A774E9EED0699322EF35F5662BC37631D0F888D447320625A0CC5981827C"

          test -f "$APK"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"

          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          ACTUAL="${ACTUAL//:/}"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Unexpected APK signing certificate: $ACTUAL"
            exit 1
          fi

          echo "APK signature verified with permanent Metallo certificate."

      - name: Prepare verified release artifacts
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("../updates/proxima-versao.json"))["version"])')"
          cp ../updates/proxima-versao.json build/app/outputs/flutter-apk/latest.json
          cp "../05_DOCUMENTACAO/RELEASE_${VERSION}.md" build/app/outputs/flutter-apk/RELEASE_NOTES.md
          cd build/app/outputs/flutter-apk
          cp app-release.apk Metallo.apk
          sha256sum Metallo.apk > Metallo.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: metallo-android-apk
          path: |
            02_MOBILE/build/app/outputs/flutter-apk/Metallo.apk
            02_MOBILE/build/app/outputs/flutter-apk/Metallo.apk.sha256
            02_MOBILE/build/app/outputs/flutter-apk/latest.json
            02_MOBILE/build/app/outputs/flutter-apk/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14


  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: metallo-android-publication
      cancel-in-progress: false
    steps:
      - name: Checkout publication scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download verified APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: metallo-android-apk
          path: release
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release
          sha256sum --check Metallo.apk.sha256
          gh release create "$GITHUB_REF_NAME" \
            "Metallo.apk" "Metallo.apk.sha256" "latest.json" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft \
            --title "Metallo $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Verify public download before announcing update
        run: |
          set -euo pipefail
          mkdir public-check
          cd public-check
          curl --fail --location --retry 3 --output Metallo.apk \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Metallo.apk"
          cp ../release/Metallo.apk.sha256 .
          sha256sum --check Metallo.apk.sha256

      - name: Activate update for installed applications
        env:
          GH_TOKEN: ${{ github.token }}
        run: node 07_CONFIGURACOES_DO_PROJETO/ativar-atualizacao.mjs --publicar release/latest.json
