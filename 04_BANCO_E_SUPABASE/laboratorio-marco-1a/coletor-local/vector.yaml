data_dir: /var/lib/vector
api:
  enabled: true
  address: 127.0.0.1:9001
sources:
  laboratorio:
    type: docker_logs
    docker_host: unix:///var/run/docker.sock
    include_labels:
      - com.supabase.cli.project=laboratorio-marco-1a
    exclude_containers:
      - supabase_vector_laboratorio-marco-1a
    retry_backoff_secs: 10
transforms:
  preparar:
    type: remap
    inputs: [laboratorio]
    source: |
      nome = string!(.container_name)
      .event_message = del(.message)
      .project = "default"
      .metadata = {}
      .metadata.timestamp = .timestamp
      if starts_with(nome, "supabase_auth_") {
        .source_name = "gotrue.logs.prod"
        dados, erro = parse_json(.event_message)
        if erro == null && is_object(dados) { .metadata = merge!(.metadata, dados) }
      } else if starts_with(nome, "supabase_db_") {
        .source_name = "postgres.logs"
        .metadata.host = "db-default"
      } else if starts_with(nome, "supabase_rest_") {
        .source_name = "postgREST.logs.prod"
      } else if starts_with(nome, "supabase_realtime_") {
        .source_name = "realtime.logs.prod"
      } else if starts_with(nome, "supabase_storage_") {
        .source_name = "storage.logs.prod.2"
      } else if starts_with(nome, "supabase_kong_") {
        .source_name = "cloudflare.logs.prod"
      } else if starts_with(nome, "supabase_edge_runtime_") {
        .source_name = "deno-relay-logs"
      } else {
        abort
      }
      .appname = nome
      del(.label)
      del(.container_id)
      del(.container_name)
      del(.container_created_at)
      del(.source_type)
      del(.stream)
      del(.image)
      del(.host)
sinks:
  analytics_local:
    type: http
    inputs: [preparar]
    uri: "http://supabase_analytics_laboratorio-marco-1a:4000/api/logs?source_name={{ source_name }}"
    method: post
    encoding:
      codec: json
    request:
      headers:
        x-api-key: "${VECTOR_LOGFLARE_KEY}"
      retry_initial_backoff_secs: 5
      retry_max_duration_secs: 10
      timeout_secs: 5
    buffer:
      type: memory
      max_events: 500
      when_full: block
